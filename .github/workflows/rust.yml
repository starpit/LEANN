name: Rust CI

on:
  push:
    branches: [main]
    paths: [leann-rs/**]
  pull_request:
    branches: [main]
    paths: [leann-rs/**]
  workflow_dispatch:

jobs:
  check:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leann-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features full -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        features: [default, full]
    defaults:
      run:
        working-directory: leann-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: leann-rs -> target
          key: ${{ matrix.os }}-${{ matrix.features }}
      - name: Run tests (default features)
        if: matrix.features == 'default'
        run: cargo test --workspace
      - name: Run tests (full features)
        if: matrix.features == 'full'
        run: cargo test --workspace --features full

  maturin:
    name: Python bindings
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - name: Build wheel
        working-directory: leann-rs/crates/leann-python
        run: maturin build
      - name: Verify wheel was produced
        run: ls leann-rs/crates/leann-python/target/wheels/*.whl
