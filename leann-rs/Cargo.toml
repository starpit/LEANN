[workspace]
resolver = "2"
members = [
    "crates/leann-core",
    "crates/leann-cli",
    "crates/leann-server",
]
exclude = [
    "crates/leann-python",  # Built via maturin separately
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/your-org/leann"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Numeric
ndarray = "0.16"
rand = "0.8"

# ZMQ + msgpack
zeromq = "0.4"
rmp-serde = "1"

# ONNX Runtime
ort = "2"

# HTTP client
reqwest = { version = "0.12", features = ["json", "blocking"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Python bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

# Parallelism
rayon = "1"

# Memory-mapped files
memmap2 = "0.9"

# HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Tokenization
tiktoken-rs = "0.6"

# AST parsing
tree-sitter = "0.24"

# File watching
notify = "7"

# Hashing
sha2 = "0.10"

# Progress bars
indicatif = "0.17"

# PDF extraction
pdf-extract = "0.10"

# Regex
regex = "1"

# UUID
uuid = { version = "1", features = ["v4"] }

# leann crates
leann-core = { path = "crates/leann-core" }

[profile.release]
opt-level = 3
lto = "thin"
