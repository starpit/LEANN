[package]
name = "leann-core"
description = "LEANN is a revolutionary vector database that democratizes personal AI. Transform your laptop into a powerful RAG system that can index and search through millions of documents while using 97% less storage than traditional solutions without accuracy loss."
readme = "../../README.md"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true
keywords = ["hnsw", "vector-search", "nearest-neighbor", "rag"]
categories = ["algorithms", "science"]

[dependencies]
# Always-required
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ndarray = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
libc = "0.2"

# Optional — gated by features
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }

# Declared but currently unused in source — kept optional for future use
memmap2 = { workspace = true, optional = true }
tiktoken-rs = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
indicatif = { workspace = true, optional = true }

# Tree-sitter grammar-based AST chunking (opt-in)
tree-sitter = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }

[features]
default = ["chat", "embedding-remote", "parallel", "bm25", "watch", "pdf", "multi-vector"]

# PDF document loading
pdf = ["dep:pdf-extract"]

# LLM chat backends + ReAct agent (pulls in reqwest)
chat = ["dep:reqwest"]

# Remote embedding providers: OpenAI, Ollama, Gemini (pulls in reqwest + tokio)
embedding-remote = ["dep:reqwest", "dep:tokio"]

# Parallel HNSW build via rayon
parallel = ["dep:rayon"]

# BM25 keyword search
bm25 = []

# Multi-vector (ColBERT) index support
multi-vector = ["dep:memmap2"]

# Merkle-tree incremental sync / file watching
watch = ["dep:sha2"]

# Tree-sitter AST chunking (Python parity). Enables accurate, grammar-based
# code chunking. Each language can be enabled individually, or use the umbrella
# `tree-sitter` feature for all supported languages.
#
# To add a new language:
#   1. Add `tree-sitter-<lang>` to [workspace.dependencies] in root Cargo.toml
#   2. Add `tree-sitter-<lang> = { workspace = true, optional = true }` to [dependencies] here
#   3. Add a feature: `tree-sitter-<lang> = ["dep:tree-sitter", "dep:tree-sitter-<lang>"]`
#   4. Add it to the `tree-sitter` umbrella feature list
#   5. Add a language entry in `chunking/tree_sitter.rs` with node type queries
#   6. Map the extension in `chunking/tree_sitter.rs::get_language_config()`
tree-sitter = ["tree-sitter-python", "tree-sitter-java", "tree-sitter-c-sharp", "tree-sitter-typescript", "tree-sitter-javascript"]
tree-sitter-python = ["dep:tree-sitter", "dep:tree-sitter-python"]
tree-sitter-java = ["dep:tree-sitter", "dep:tree-sitter-java"]
tree-sitter-c-sharp = ["dep:tree-sitter", "dep:tree-sitter-c-sharp"]
tree-sitter-typescript = ["dep:tree-sitter", "dep:tree-sitter-typescript"]
tree-sitter-javascript = ["dep:tree-sitter", "dep:tree-sitter-javascript"]

# Everything
full = ["chat", "embedding-remote", "parallel", "bm25", "watch", "pdf", "tree-sitter", "multi-vector"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
criterion = { version = "0.8", features = ["html_reports"] }
rayon = { workspace = true }

[[bench]]
name = "hnsw_benchmarks"
harness = false

[[bench]]
name = "bench_json_output"
harness = false
